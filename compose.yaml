name: ag-coin-blockchain

services:
  test:
    image: docker.io/paritytech/ci-unified:latest
    working_dir: /workspace
    command: ["cargo", "test", "--workspace", "--locked"]
    volumes:
      - .:/workspace:ro
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/workspace-target
    environment:
      CARGO_TARGET_DIR: /workspace-target
      CARGO_BUILD_JOBS: "2"
    mem_limit: 4g
    cpus: 2
    pids_limit: 512

  node:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--dev", "--rpc-external"]
    ports:
      - "30333:30333"
      - "9933:9933"
      - "9944:9944"
      - "9615:9615"
    volumes:
      - node-data:/data
    mem_limit: 4g
    cpus: 2
    pids_limit: 512

volumes:
  cargo-registry:
  cargo-git:
  cargo-target:
  node-data:
